<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1330" />
    <meta name="description" content="Walk one vast valley in Starfall Grove: help and rescue its people, learn new spells, and defeat the guardians and the Eclipse." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starfall" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Starfall Grove" />
    <meta property="og:description" content="A storybook action RPG: four lands, five heroes and one fallen star." />
    <meta property="og:image" content="starfall-grove-game-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Starfall Grove</title>
    <style>
      /* The loading screen: shown by the HTML itself, before any code has arrived, and faded out once the game is ready. */
      html, body { margin: 0; background: #0d1330; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 35%, #2a2560 0%, #141a44 45%, #080b1e 100%); color: #f4e6c4; font-family: Georgia, 'Times New Roman', serif; transition: opacity .6s ease, visibility .6s; }
      #boot.gone { opacity: 0; visibility: hidden; }
      #boot .b-in { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px; text-align: center; }
      #boot .b-star { width: 78px; height: 78px; animation: b-spin 5s linear infinite, b-pulse 2.2s ease-in-out infinite; filter: drop-shadow(3px 4px 0 rgba(18, 10, 20, .55)) drop-shadow(0 0 16px rgba(255, 211, 92, .5)); }
      #boot .b-name { margin: 0; font-size: clamp(34px, 7vw, 60px); font-weight: 700; letter-spacing: .08em; line-height: 1; color: #fff4de; -webkit-text-stroke: 1.5px #2f2330; paint-order: stroke fill; text-shadow: 0 3px 0 rgba(18, 10, 20, .7), 0 0 22px rgba(245, 210, 122, .35); }
      #boot .b-tag { margin: 0; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: rgba(244, 230, 196, .7); }
      #boot .b-bar { width: min(240px, 60vw); height: 10px; border-radius: 6px; background: #2a2030; border: 1.5px solid #fff1d6; box-shadow: 0 0 0 1.5px #2f2330, 2px 3px 0 rgba(18, 10, 20, .5); overflow: hidden; }
      #boot .b-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, rgba(245, 210, 122, 0), #f5d27a, rgba(245, 210, 122, 0)); animation: b-slide 1.3s ease-in-out infinite; }
      #boot .b-dust { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      #boot .b-dust b { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; background: #fff1b8; box-shadow: 0 0 8px #ffd35c; opacity: 0; animation: b-rise 6s linear infinite; }
      @keyframes b-spin { to { transform: rotate(360deg); } }
      @keyframes b-pulse { 50% { filter: drop-shadow(3px 4px 0 rgba(18, 10, 20, .55)) drop-shadow(0 0 28px rgba(255, 211, 92, .9)); } }
      @keyframes b-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes b-rise { 10% { opacity: .9; } 90% { opacity: .6; } to { transform: translateY(-105vh); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot .b-star, #boot .b-bar i, #boot .b-dust b { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Starfall Grove">
      <div class="b-dust" aria-hidden="true"><b style="left:12%;animation-delay:.2s"></b><b style="left:27%;animation-delay:2.4s"></b><b style="left:41%;animation-delay:1.1s"></b><b style="left:58%;animation-delay:3.3s"></b><b style="left:70%;animation-delay:.7s"></b><b style="left:84%;animation-delay:4.1s"></b><b style="left:93%;animation-delay:1.8s"></b></div>
      <div class="b-in">
        <svg class="b-star" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="bs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" /><stop offset=".45" stop-color="#fff1b8" /><stop offset="1" stop-color="#f5a83a" /></radialGradient></defs><path d="M32 5 L38 26 L59 32 L38 38 L32 59 L26 38 L5 32 L26 26 Z" fill="#2f2330" stroke="#2f2330" stroke-width="10" stroke-linejoin="round" /><path d="M32 5 L38 26 L59 32 L38 38 L32 59 L26 38 L5 32 L26 26 Z" fill="#fff4de" stroke="#fff4de" stroke-width="6.5" stroke-linejoin="round" /><path d="M32 5 L38 26 L59 32 L38 38 L32 59 L26 38 L5 32 L26 26 Z" fill="url(#bs)" /><circle cx="32" cy="32" r="5" fill="#ffffff" /></svg>
        <p class="b-name">Starfall Grove</p>
        <p class="b-tag">The valley is waking</p>
        <div class="b-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
